  <meta name="robots" content="noindex, follow" />
  <title>Agencia | Red de Autos</title>
  <meta name="description" content="Agencia en Red de Autos: autos 0km y usados, datos de contacto y ubicación." />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />

<body>
  <a href="#contenido" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[60] focus:rounded-lg focus:bg-white focus:px-4 focus:py-2">Saltar al contenido</a>
