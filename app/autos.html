<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--slot:csp-->
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <!--slot:head-->
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="manifest" href="./site.webmanifest" />
  <link rel="preconnect" href="https://images.unsplash.com" />
  <!--slot:jsonld-->
  <script type="module" src="/src/autos.js"></script>
</head>
<body>
  <a href="#resultados" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[60] focus:rounded-lg focus:bg-white focus:px-4 focus:py-2">Saltar a los resultados</a>

  <!--slot:site-header-->

  <main id="contenido" class="pb-4">
    <!-- ================= ENCABEZADO DEL LISTADO ================= -->
    <section class="border-b border-line bg-soft">
      <div class="container-x py-8 md:py-12">
        <nav aria-label="Migas de pan" class="text-[14px] text-ink/60">
          <ol class="flex items-center gap-2">
            <li><a href="./" class="transition-colors hover:text-brand">Inicio</a></li>
            <li aria-hidden="true">/</li>
            <li aria-current="page" class="text-ink">Autos</li>
          </ol>
        </nav>
        <h1 id="listing-title" class="mt-3 text-[30px] font-bold leading-[1.1] sm:text-[38px] md:text-[44px]">Autos en venta</h1>
        <p class="mt-3 max-w-[640px] text-[16px] text-ink/70">0km y usados de concesionarios oficiales, agencias multimarca y particulares de todo el país.</p>
      </div>
    </section>

    <!-- ================= FILTROS + RESULTADOS ================= -->
    <div class="container-x grid gap-8 py-8 md:py-12 lg:grid-cols-[290px_minmax(0,1fr)] lg:gap-10">
      <div id="filters-backdrop" class="drawer-backdrop fixed inset-0 z-50 bg-ink/50 lg:hidden"></div>
      <form id="filters" class="filters-panel" aria-label="Filtros" novalidate>
        <!--slot:filters-->
      </form>

      <section id="resultados" aria-labelledby="results-count" class="min-w-0">
        <div class="mb-6 flex flex-wrap items-center justify-between gap-4">
          <h2 id="results-count" class="text-[18px] font-bold" aria-live="polite"><span data-count><!--slot:count--></span> autos</h2>
          <div class="flex flex-wrap items-center gap-3">
            <button type="button" class="btn-outline h-[46px]" data-alerta-crear title="Te avisamos con una notificación cuando entre un auto con estos filtros">
              <i data-icon="bell" class="h-4 w-4"></i> <span data-alerta-label>Avisame cuando entre</span>
            </button>
            <button type="button" id="filters-open" class="btn-outline h-[46px] lg:hidden" aria-controls="filters" aria-expanded="false">
              <i data-icon="sliders-horizontal" class="h-4 w-4"></i> Filtros <span id="filters-badge" class="hidden h-5 min-w-5 place-items-center rounded-full bg-brand px-1.5 text-[12px] text-white"></span>
            </button>
            <label for="f-orden" class="sr-only">Ordenar por</label>
            <div class="relative">
              <i data-icon="arrow-up-down" class="pointer-events-none absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2"></i>
              <select id="f-orden" class="filter-select h-[46px] pl-10 pr-10"><!--slot:sort--></select>
              <i data-icon="chevron-down" class="pointer-events-none absolute right-3 top-1/2 h-4 w-4 -translate-y-1/2"></i>
            </div>
          </div>
        </div>
        <div class="mb-6 hidden items-start gap-3 rounded-2xl px-5 py-4 text-[15px]" role="status" data-alerta-msg></div>

        <div id="car-grid" class="grid gap-6 sm:grid-cols-2 xl:grid-cols-3"><!--slot:grid--></div>

        <div id="empty-state" class="hidden rounded-2xl border border-dashed border-line px-6 py-16 text-center">
          <p class="text-[20px] font-bold">No encontramos autos con esos filtros</p>
          <p class="mt-2 text-ink/70">Probá sacar alguno o ampliar el rango de precio.</p>
          <button type="button" id="empty-reset" class="btn-primary mt-6 h-[50px] px-7"><i data-icon="rotate-ccw" class="h-4 w-4"></i> Limpiar filtros</button>
        </div>
      </section>
    </div>
  </main>

  <!--slot:footer-->
  <!--slot:to-top-->
</body>
</html>
