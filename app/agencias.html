<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--slot:csp-->
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <!--slot:head-->
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <script type="module" src="/src/agencias.js"></script>
</head>
<body>
  <a href="#contenido" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[60] focus:rounded-lg focus:bg-white focus:px-4 focus:py-2">Saltar al contenido</a>
  <!--slot:site-header-->
  <main id="contenido">
    <section class="border-b border-line bg-soft">
      <div class="container-x py-8 md:py-12">
        <nav aria-label="Migas de pan" class="text-[14px] text-ink/60">
          <ol class="flex items-center gap-2"><li><a href="./" class="transition-colors hover:text-brand">Inicio</a></li><li aria-hidden="true">/</li><li aria-current="page" class="text-ink">Agencias</li></ol>
        </nav>
        <h1 class="mt-3 text-[30px] font-bold leading-[1.1] sm:text-[38px] md:text-[44px]">Agencias y concesionarios</h1>
        <p class="mt-2 max-w-[680px] text-[16px] text-ink/70">Todas las agencias verificadas de Red de Autos. Mirá su stock o escribiles directo por WhatsApp.</p>
      </div>
    </section>

    <div class="container-x py-8 md:py-12">
      <form class="mb-8 flex flex-col gap-4 md:flex-row md:items-center md:justify-between" role="search" data-ag-filtros>
        <label class="relative block w-full md:max-w-[380px]">
          <span class="sr-only">Buscar agencia o ciudad</span>
          <i data-icon="search" class="pointer-events-none absolute left-4 top-1/2 h-4 w-4 -translate-y-1/2 text-ink/50"></i>
          <input type="search" class="filter-input !pl-11" placeholder="Buscar por nombre o ciudad" maxlength="60" data-ag-q />
        </label>
        <div class="flex flex-wrap gap-2" role="group" aria-label="Mostrar">
          <label class="filter-pill"><input type="radio" name="ag-filtro" value="todas" class="sr-only" checked /><span>Todas</span></label>
          <label class="filter-pill"><input type="radio" name="ag-filtro" value="independientes" class="sr-only" /><span>Aceptan vendedores independientes</span></label>
          <label class="filter-pill"><input type="radio" name="ag-filtro" value="oficial" class="sr-only" /><span>Concesionarios oficiales</span></label>
        </div>
      </form>
      <p class="mb-5 text-[15px] text-ink/70" aria-live="polite" data-ag-cuenta></p>
      <ul class="grid gap-5 sm:grid-cols-2 xl:grid-cols-3" data-ag-lista>
        <li class="col-span-full flex items-center gap-2 text-ink/60"><i data-icon="loader-circle" class="h-4 w-4 animate-spin"></i> Cargando agencias…</li>
      </ul>
    </div>
  </main>
  <!--slot:footer-->
  <!--slot:to-top-->
</body>
</html>
