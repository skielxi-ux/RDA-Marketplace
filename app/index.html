<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--slot:csp-->
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <!--slot:head-->
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="manifest" href="./site.webmanifest" />
  <link rel="preconnect" href="https://images.unsplash.com" />
  <!--slot:jsonld-->
  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <a href="#contenido" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[60] focus:rounded-lg focus:bg-white focus:px-4 focus:py-2">Saltar al contenido</a>

  <!--slot:site-header-->

  <main id="contenido">
    <!-- ================= HERO (todo el ancho) + BUSCADOR ================= -->
    <section aria-labelledby="hero-title" class="relative">
      <div class="relative">
        <div id="hero" class="swiper h-[460px] sm:h-[520px] md:h-[620px]" aria-roledescription="carrusel" aria-label="Fotos destacadas">
          <div class="swiper-wrapper"><!--slot:hero--></div>
        </div>
        <div class="pointer-events-none absolute inset-x-0 top-[52px] z-10 px-6 text-center sm:top-[84px] md:top-[140px]">
          <h1 id="hero-title" class="text-[14px] text-white sm:text-[15px]">Autos 0km y usados de agencias y concesionarios oficiales</h1>
        </div>
        <button type="button" class="hero-nav hero-prev left-4 lg:left-[30px]" aria-label="Foto anterior"><i data-icon="chevron-left" class="h-4 w-4"></i></button>
        <button type="button" class="hero-nav hero-next right-4 lg:right-[30px]" aria-label="Foto siguiente"><i data-icon="chevron-right" class="h-4 w-4"></i></button>
      </div>

      <div class="container-x">
        <div class="relative z-20 mx-auto -mt-[74px] max-w-[1160px]">
          <div id="search-tabs" class="tabs-light flex gap-7 rounded-t-2xl bg-white/20 px-6 pt-4 backdrop-blur-md md:px-[42px]" role="tablist" aria-label="Condición del auto">
            <button type="button" role="tab" id="tab-cond-todos" class="tab-btn is-active" aria-selected="true" data-cond="todos">Todos</button>
            <button type="button" role="tab" id="tab-cond-0km" class="tab-btn" aria-selected="false" tabindex="-1" data-cond="0km">0km</button>
            <button type="button" role="tab" id="tab-cond-usados" class="tab-btn" aria-selected="false" tabindex="-1" data-cond="usados">Usados</button>
          </div>
          <form id="search-form" role="search" action="./autos.html" method="get" class="grid grid-cols-2 items-center gap-x-6 gap-y-5 rounded-b-2xl bg-white px-6 py-6 shadow-[0_10px_40px_rgba(5,11,32,0.07)] md:px-[42px] lg:grid-cols-[1fr_1fr_1fr_1fr_216px] lg:py-[22px]">
            <input type="hidden" name="condicion" id="search-condition" value="todos" />
            <div class="relative">
              <label for="sel-make" class="field-label">Marca</label>
              <select id="sel-make" name="marca" class="field-select"><option value="">Todas las marcas</option><!--slot:makes--></select>
              <i data-icon="chevron-down" class="pointer-events-none absolute bottom-0.5 right-0 h-4 w-4"></i>
            </div>
            <div class="relative lg:border-l lg:border-line lg:pl-6">
              <label for="sel-model" class="field-label">Modelo</label>
              <select id="sel-model" name="modelo" class="field-select" disabled><option value="">Todos los modelos</option></select>
              <i data-icon="chevron-down" class="pointer-events-none absolute bottom-0.5 right-0 h-4 w-4"></i>
            </div>
            <div class="relative lg:border-l lg:border-line lg:pl-6">
              <label for="sel-year" class="field-label">Año</label>
              <select id="sel-year" name="anio" class="field-select">
                <option value="">Cualquier año</option><option value="2026">2026 (0km)</option><option value="2022">2022 o más nuevo</option><option value="2018">2018 o más nuevo</option><option value="2014">2014 o más nuevo</option>
              </select>
              <i data-icon="chevron-down" class="pointer-events-none absolute bottom-0.5 right-0 h-4 w-4"></i>
            </div>
            <div class="relative lg:border-l lg:border-line lg:pl-6">
              <label for="sel-price" class="field-label">Precio</label>
              <select id="sel-price" name="precio" class="field-select">
                <option value="">Todos los precios</option><option value="0-15000">Hasta US$ 15.000</option><option value="15000-30000">US$ 15.000 – 30.000</option><option value="30000-60000">US$ 30.000 – 60.000</option><option value="60000-">Más de US$ 60.000</option>
              </select>
              <i data-icon="chevron-down" class="pointer-events-none absolute bottom-0.5 right-0 h-4 w-4"></i>
            </div>
            <button type="submit" class="btn-primary col-span-2 h-[55px] lg:col-span-1">
              <i data-icon="search" class="h-4 w-4"></i> Buscar
            </button>
          </form>
        </div>
      </div>
    </section>

    <!-- ================= CARROCERÍAS ================= -->
    <section aria-labelledby="types-title" class="pt-16 md:pt-[90px]">
      <div class="container-x">
        <div class="reveal mb-8 flex items-end justify-between gap-4 md:mb-10">
          <h2 id="types-title" class="section-title">Buscá por carrocería</h2>
          <a href="#carrocerias" class="link-view">Ver todas <i data-icon="arrow-up-right" class="h-4 w-4"></i></a>
        </div>
        <div id="types" class="swiper reveal"><div class="swiper-wrapper"><!--slot:types--></div></div>
      </div>
    </section>

    <!-- ================= POR QUÉ ELEGIRNOS ================= -->
    <section aria-labelledby="why-title" class="pt-20 md:pt-[110px]">
      <div class="container-x">
        <div class="relative">
          <div class="absolute inset-y-0 left-1/2 w-full max-w-[1160px] -translate-x-1/2 rounded-2xl bg-soft" aria-hidden="true"></div>
          <div class="relative py-12 md:py-[60px] md:pb-[110px]">
            <h2 id="why-title" class="section-title reveal mb-10 text-center md:mb-[46px]">¿Por qué Red de Autos?</h2>
            <div class="grid gap-5 sm:grid-cols-2 xl:grid-cols-4 xl:gap-[30px]"><!--slot:reasons--></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ================= DESTACADOS ================= -->
    <section id="destacados" aria-labelledby="featured-title" class="pt-20 md:pt-[110px]">
      <div class="container-x">
        <div class="reveal mb-6 flex items-end justify-between gap-4 md:mb-[30px]">
          <h2 id="featured-title" class="section-title">Autos destacados</h2>
          <a href="./autos.html" class="link-view">Ver todos <i data-icon="arrow-up-right" class="h-4 w-4"></i></a>
        </div>
        <div id="featured-tabs" class="tabs-brand reveal mb-10 flex gap-7 overflow-x-auto border-b border-line md:mb-[50px]" role="tablist" aria-label="Tipo de auto"><!--slot:featured-tabs--></div>
        <div id="featured" class="swiper reveal" role="tabpanel" aria-labelledby="tab-nuevos"><div class="swiper-wrapper"><!--slot:featured--></div></div>
        <div class="mt-10 flex gap-4">
          <button type="button" class="round-nav featured-prev" aria-label="Autos anteriores"><i data-icon="chevron-left" class="h-4 w-4"></i></button>
          <button type="button" class="round-nav featured-next" aria-label="Autos siguientes"><i data-icon="chevron-right" class="h-4 w-4"></i></button>
        </div>
      </div>
    </section>

    <!-- ================= SEGUNDA MITAD ================= -->
    <!--slot:dealers--><!--slot:sell--><!--slot:stats--><!--slot:testimonials--><!--slot:brands-->
  </main>

  <!--slot:footer-->

  <!--slot:to-top-->
</body>
</html>
