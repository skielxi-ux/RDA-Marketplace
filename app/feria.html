<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--slot:csp-->
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <!--slot:head-->
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <script type="module" src="/src/feria-page.js"></script>
</head>
<body>
  <a href="#contenido" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[60] focus:rounded-lg focus:bg-white focus:px-4 focus:py-2">Saltar al contenido</a>
  <!--slot:site-header-->
  <main id="contenido" aria-busy="true">
    <div class="container-x pt-6 md:pt-8">
      <nav aria-label="Migas de pan" class="text-[14px] text-ink/60">
        <ol class="flex items-center gap-2"><li><a href="./" class="transition-colors hover:text-brand">Inicio</a></li><li aria-hidden="true">/</li><li aria-current="page" class="text-ink">Feria online</li></ol>
      </nav>
    </div>

    <section id="feria-banner" aria-labelledby="feria-nombre" class="pt-5" hidden>
      <div class="container-x">
        <div class="feria-card">
          <div class="min-w-0">
            <p class="inline-flex items-center gap-2 rounded-full bg-white/10 px-3.5 py-1.5 text-[13px] font-medium text-[#9DB0FF]">
              <i data-icon="zap" class="h-4 w-4"></i> <span data-feria-estado>Feria online</span>
            </p>
            <h1 id="feria-nombre" class="mt-4 text-[30px] font-bold leading-[1.1] text-balance sm:text-[40px]" data-feria-nombre></h1>
            <p class="mt-3 max-w-[560px] text-[16px] leading-[1.6] text-white/75" data-feria-desc></p>
            <p class="mt-3 text-[14px] text-white/60" data-feria-fechas></p>
          </div>
          <div class="flex flex-col gap-5 lg:items-end">
            <p class="text-[14px] font-medium text-white/70" data-feria-cuenta-label>Empieza en</p>
            <div class="grid grid-cols-4 gap-2 sm:gap-3" role="timer" aria-live="off">
              <div class="feria-num"><span data-cd="d">0</span><small>días</small></div>
              <div class="feria-num"><span data-cd="h">00</span><small>horas</small></div>
              <div class="feria-num"><span data-cd="m">00</span><small>min</small></div>
              <div class="feria-num"><span data-cd="s">00</span><small>seg</small></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="container-x py-8 md:py-12" aria-labelledby="fe-titulo">
      <div class="mb-6 flex flex-col gap-4 md:flex-row md:items-end md:justify-between">
        <div>
          <h2 id="fe-titulo" class="text-[24px] font-bold sm:text-[28px]">Autos con precio relámpago</h2>
          <p class="mt-1 text-[15px] text-ink/70" data-fe-cuenta>Cargando autos…</p>
        </div>
        <div data-fe-orden-box hidden>
          <label for="fe-orden" class="sr-only">Ordenar por</label>
          <div class="relative">
            <i data-icon="arrow-up-down" class="pointer-events-none absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2"></i>
            <select id="fe-orden" class="filter-select h-[46px] pl-10 pr-10" data-fe-orden>
              <option value="termina">Terminan antes</option>
              <option value="descuento">Mayor descuento</option>
              <option value="precio">Menor precio</option>
            </select>
            <i data-icon="chevron-down" class="pointer-events-none absolute right-3 top-1/2 h-4 w-4 -translate-y-1/2"></i>
          </div>
        </div>
      </div>
      <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4" data-fe-grid></div>
      <div class="rounded-[24px] border border-dashed border-line p-8 text-center sm:p-12" data-fe-vacio hidden>
        <span class="mx-auto grid h-14 w-14 place-items-center rounded-2xl bg-soft text-brand"><i data-icon="zap" class="h-6 w-6"></i></span>
        <p class="mt-4 text-[20px] font-bold" data-fe-vacio-titulo>Todavía no hay autos en la feria</p>
        <p class="mx-auto mt-2 max-w-[520px] text-[15px] text-ink/70" data-fe-vacio-texto>Las agencias están sumando sus autos con precio relámpago. Volvé en un rato.</p>
        <a href="./autos.html" class="btn-primary mx-auto mt-6 h-[50px] w-fit !px-6"><i data-icon="car" class="h-4 w-4"></i> Ver todos los autos</a>
      </div>
    </section>
  </main>
  <!--slot:footer-->
  <!--slot:to-top-->
</body>
</html>
