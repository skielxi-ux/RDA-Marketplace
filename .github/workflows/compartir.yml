# Genera las páginas para compartir autos (c/<id>.html) con foto, título y precio para WhatsApp.
name: Vistas previas para compartir
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['build/compartir.mjs', '.github/workflows/compartir.yml']
permissions:
  contents: write
concurrency:
  group: compartir
  cancel-in-progress: false
jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock sharp@0.34
      - run: node build/compartir.mjs
      - name: Guardar cambios
        run: |
          git config user.name "Red de Autos"
          git config user.email "actions@users.noreply.github.com"
          git add c sitemap-autos.xml
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Vistas previas para compartir"
          git pull --rebase origin main
          git push origin HEAD:main
